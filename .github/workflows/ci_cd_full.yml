name: CI-CD Full Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Give execute permission
        run: chmod +x app/check_app.sh

      - name: Run application check script
        run: ./app/check_app.sh

      - name: Display index.html content
        run: cat app/index.html

      - name: Display secrets and environment variables
        env:
          CUSTOM_ENV: "HelloFromCI"
          RUNNER_OS: ${{ runner.os }}
          FAKE_API_TOKEN: ${{ secrets.FAKE_API_TOKEN }}
          ENV_TYPE: ${{ secrets.ENV_TYPE }}
        run: |
          echo "Custom env: $CUSTOM_ENV"
          echo "Runner OS: $RUNNER_OS"
          echo "Fake API Token (masked): $FAKE_API_TOKEN"
          echo "Environment type (masked): $ENV_TYPE"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SSH private key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "Vérification du format de la clé..."
          ssh-keygen -y -f /tmp/deploy_key -P "" > /tmp/pub_check.pub && echo "OK: clé valide, sans passphrase, format correct"
          KEY_BITS=$(ssh-keygen -lf /tmp/deploy_key | awk '{print $1}')
          echo "Taille de la clé : $KEY_BITS bits"
          if [ "$KEY_BITS" -lt 2048 ]; then
            echo "ERREUR: clé trop courte (minimum 2048 bits requis)"
            exit 1
          fi

      - name: Validate server configuration
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ -z "$SERVER_IP" ] || [ -z "$SERVER_USER" ]; then
            echo "ERREUR: SERVER_IP ou SERVER_USER manquant"
            exit 1
          fi
          echo "OK: SERVER_IP défini ($SERVER_USER@$SERVER_IP)"

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install ansible -y

      - name: Create Ansible inventory file
        run: |
          mkdir -p ansible
          cat > ansible/inventory.ini << EOF
          [web]
          ${{ secrets.SERVER_IP }} ansible_user=${{ secrets.SERVER_USER }} ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF
          chmod 600 ansible/inventory.ini
          echo "Inventory généré (simulation - contenu masqué pour sécurité)"

      - name: Simulate Ansible deployment
        run: |
          echo "=== SIMULATION DE DÉPLOIEMENT ==="
          echo "Commandes qui seraient exécutées :"
          echo "ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --private-key /tmp/deploy_key"
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --syntax-check
          echo "OK: syntaxe du playbook valide"
          echo "=== Déploiement simulé avec succès (accès réseau réel non disponible depuis ce runner) ==="

      - name: Security checks summary
        run: |
          echo "✓ Clé SSH dédiée validée (2048+ bits, sans passphrase)"
          echo "✓ Secrets GitHub utilisés (pas de credentials en clair)"
          echo "✓ Utilisateur non-root (deployuser) configuré dans l'inventory"
          echo "✓ Permissions inventory.ini restreintes (600)"# trigger check Thu Aug  6 10:12:00 PM CEST 2026
